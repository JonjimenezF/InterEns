<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar></ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding menu-content">
    <div class="vertical-buttons">

      <ion-button fill="clear" class="menu-btn" (click)="perfil()" expand="block">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <span>Perfil</span>
      </ion-button>

      <!-- ❤️ FAVORITOS -->
      <ion-button fill="clear" class="menu-btn" (click)="favoritos()" expand="block">
        <ion-icon name="heart-outline" slot="start"></ion-icon>
        <span>Favoritos</span>
      </ion-button>

      <ion-button fill="clear" class="menu-btn" (click)="preguntas()" expand="block">
        <ion-icon name="help-circle-outline" slot="start"></ion-icon>
        <span>Preguntas Frecuentes</span>
      </ion-button>

      <ion-button fill="clear" class="menu-btn" (click)="contacto()" expand="block">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <span>Contacto</span>
      </ion-button>

      <ion-button fill="clear" (click)="goConsejos()" class="menu-btn" expand="block">
  <ion-icon name="help-circle-outline" slot="start"></ion-icon>
  <span>Consejos de envío</span>
</ion-button>



      


      

    </div>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button auto-hide="false" class="icono-accent"></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>




  <ion-content>
    <!-- 🧑‍💻 Bienvenida -->
    <div class="welcome-card">
      <ion-avatar>
        <img [src]="avatarUrl || '/assets/img/avatar.png'" />
      </ion-avatar>
      <div>
        <h2 class="color-txt">Bienvenido</h2>
        <p class="color-muted">Reciclemos tus artículos</p>
      </div>
    </div>

    <!-- 💰 Puntos -->
    <div class="balance-card">
      <div
        class="action-card"
        [class.selected]="selectedCard === 'puntos'"
        (click)="selectCard('puntos'); goPuntos()"
      >
        <p class="color-muted">Puntos Disponibles</p>
        <h2 class="accent">{{ puntosTotales }} InterCoins</h2>
      </div>
    </div>

    <!-- ⚙️ Acciones principales -->
    <div class="grid-actions">
      <div
        class="action-card"
        [class.selected]="selectedCard === 'donar'"
        (click)="selectCard('donar'); goSubirfoto()"
      >
        <ion-icon name="cloud-upload-outline" class="faq-icon"></ion-icon>
        <p>Subir producto</p>
      </div>

      <div
        class="action-card"
        [class.selected]="selectedCard === 'misiones'"
        (click)="selectCard('misiones'); misiones()"
      >
        <ion-icon name="trophy-outline" class="faq-icon"></ion-icon>
        <p>Misiones</p>
      </div>

      <div 
  class="action-card"
  [class.selected]="selectedCard === 'mapa'"
  (click)="mapa()"
>
  <ion-icon name="cart-outline" class="faq-icon"></ion-icon>
  <p>Puntos Limpios</p>
</div>


      <div
        class="action-card"
        [class.selected]="selectedCard === 'faq'"
        (click)="selectCard('faq'); goProducto()"
      >
        <ion-icon name="search-outline" class="faq-icon"></ion-icon>
        <p>Buscar Productos</p>
      </div>
    </div>

    <!-- ✨ ANIMACIÓN DE PUNTOS GANADOS -->
    <div *ngIf="mostrarAnimacion" class="floating-points">
      +{{ puntosGanados }} InterCoins 💚
    </div>
  </ion-content>
</div>
