<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button (click)="goBack()" defaultHref="home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Mis Favoritos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- 🔄 Spinner mientras carga -->
  <div *ngIf="loading" class="spinner-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando tus favoritos...</p>
  </div>

  <!-- 💖 Lista de favoritos -->
  <ion-grid *ngIf="!loading && favoritos.length > 0">
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let p of favoritos">
        <ion-card>
          <!-- ❤️ Botón eliminar favorito -->
          <ion-button fill="clear" class="fav-btn" (click)="eliminarFavorito(p.id)">
            <ion-icon name="heart"></ion-icon>
          </ion-button>

          <!-- 🖼️ Imagen del producto -->
          <img [src]="getImagenProducto(p)" alt="Imagen del producto" class="product-image" />

          <!-- ℹ️ Información -->
          <div class="product-info">
            <h2>{{ p.titulo }}</h2>
            <p class="desc">{{ p.descripcion }}</p>
            <p class="price">
              <ion-icon name="trophy-outline"></ion-icon>
              {{ p.valor_puntos }} pts
            </p>
            <p class="ubicacion">{{ p.region }} - {{ p.ciudad }}</p>

            <ion-button
              expand="block"
              shape="round"
              class="custom-button"
              (click)="verDetalle(p)">
              Detalle Producto
            </ion-button>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- 🪶 Sin favoritos -->
  <div *ngIf="!loading && favoritos.length === 0" class="empty-list">
    <ion-icon name="heart-outline"></ion-icon>
    <p>No tienes productos en tu lista de deseos aún ❤️</p>
  </div>
</ion-content>

<app-footer-interens></app-footer-interens>
