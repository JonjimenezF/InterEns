<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/puntos" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="fondocanjear">
  <section class="intro">
    <h1>¡Canjea tus puntos!</h1>
    <p>
      Elige un producto disponible según tus puntos acumulados 🌿  
      Actualmente tienes <strong>{{ puntosTotales }}</strong> InterCoins.
    </p>
  </section>

  <section class="recompensas">
    <div *ngIf="loading" class="spinner-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <ion-card *ngFor="let item of productos" class="reward-card">
      <ion-img
        [src]="item.imagen_url || 'assets/img/default.png'"
        alt="{{ item.titulo }}"
      ></ion-img>

      <ion-card-header>
        <ion-card-title>{{ item.titulo }}</ion-card-title>
        <ion-card-subtitle>
          {{ item.valor_puntos }} puntos
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <!-- 🚫 Si el producto pertenece al usuario -->
        <div *ngIf="item.propietario_id === userId" class="own-product-msg">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>Este producto es tuyo 💡</span>
        </div>

        <!-- 💱 Si es de otro usuario -->
        <ion-button
          *ngIf="item.propietario_id !== userId"
          expand="block"
          shape="round"
          class="custom-button"
          (click)="canjear(item)"
          [disabled]="puntosTotales < item.valor_puntos"
        >
          <ion-icon name="swap-horizontal-outline" slot="start"></ion-icon>
          Canjear
        </ion-button>

        <!-- 🔒 Mensaje si no tiene puntos suficientes -->
        <p
          *ngIf="puntosTotales < item.valor_puntos && item.propietario_id !== userId"
          class="low-points-msg"
        >
          <ion-icon name="lock-closed-outline"></ion-icon>
          Te faltan {{ item.valor_puntos - puntosTotales }} puntos
        </p>
      </ion-card-content>
    </ion-card>
  </section>
</ion-content>

<app-footer-interens></app-footer-interens>
